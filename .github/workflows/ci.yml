name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '24'
          - os: ubuntu-latest
            node: '22.13.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - run: npm run build:storybook
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
      - name: Check pull-request commit messages
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.node == '24'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm exec --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  browser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:browser:ci
      - run: npm run test:browser:ci -- --dev

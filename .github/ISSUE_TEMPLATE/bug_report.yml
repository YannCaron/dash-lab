name: Bug report
description: Report reproducible unexpected behavior.
title: '[Bug]: '
labels: [bug]
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: dash-lab, Node.js, operating system, and browser versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps or minimal reproduction
      description: Include the smallest example that reproduces the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and relevant logs
    validations:
      required: true
